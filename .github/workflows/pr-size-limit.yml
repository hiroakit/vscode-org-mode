name: PR Size Limit

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-size-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate PR size
        uses: actions/github-script@v7
        with:
          script: |
            const maxChangedLines = 400;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("Missing pull_request payload.");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const excludedFilenames = new Set(["package-lock.json"]);
            const includedFiles = files.filter(file => !excludedFilenames.has(file.filename));
            const excludedFiles = files.filter(file => excludedFilenames.has(file.filename));

            const additions = includedFiles.reduce((sum, file) => sum + file.additions, 0);
            const deletions = includedFiles.reduce((sum, file) => sum + file.deletions, 0);
            const total = additions + deletions;
            const excludedAdditions = excludedFiles.reduce((sum, file) => sum + file.additions, 0);
            const excludedDeletions = excludedFiles.reduce((sum, file) => sum + file.deletions, 0);
            const rationale = "https://smartbear.com/resources/case-studies/cisco-systems-collaborator/";

            core.info(`PR additions: ${additions}, deletions: ${deletions}, total: ${total}`);
            if (excludedFiles.length > 0) {
              core.info(
                `Excluded files: ${excludedFiles.map(file => file.filename).join(", ")} ` +
                `(additions: ${excludedAdditions}, deletions: ${excludedDeletions})`
              );
            }

            await core.summary
              .addHeading("PR size check")
              .addTable([
                [
                  { data: "Additions", header: true },
                  { data: "Deletions", header: true },
                  { data: "Total", header: true },
                  { data: "Limit", header: true }
                ],
                [
                  additions.toString(),
                  deletions.toString(),
                  total.toString(),
                  maxChangedLines.toString()
                ]
              ])
              .addRaw(`\nExcluded from count: ${[...excludedFilenames].join(", ") || "None"}\n`)
              .addRaw(`Rationale for the 400-line limit: ${rationale}\n`)
              .write();

            if (total > maxChangedLines) {
              core.warning(
                `PR exceeds ${maxChangedLines} changed lines (${total}). ` +
                  `Please split this PR into smaller, reviewable chunks. ` +
                  `Rationale: ${rationale}`
              );
              core.setFailed(
                `PR size ${total} > ${maxChangedLines}. Split the PR before merge.`
              );
            }
